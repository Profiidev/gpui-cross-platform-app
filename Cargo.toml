[package]
name = "lt"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Plugin packages are off. To re-enable one, add its feature here and undo the
# matching "disabled" block in android/app/src/main/AndroidManifest.xml (iOS
# usage strings are in ios/Info.plist). Available features: url_launcher,
# shared_preferences, path_provider, package_info, device_info, connectivity,
# network_info, vibration, battery, share, sensors, webview, file_selector,
# image_picker, camera, permission_handler, notifications, location, audio,
# video_player, clipboard, local_auth, in_app_review, contacts, maps_launcher,
# maps, calendar, deeplink, microphone, media_session.
# The Java helpers in android/app/src/main/java/dev/gpui/mobile stay compiled;
# they are inert until a Rust feature calls them.
gpui-mobile = { package = "gpui-pre-mobile", git = "https://github.com/longbridge/gpui-mobile", rev = "c24a1308e1dcb47ce94d9ef8d8d05ca4d77d2aa7", default-features = false, features = [] }
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false }
gpui-kit = { version = "0.7.3", default-features = false, features = ["component"] }
log = "0.4"

[target.'cfg(target_os = "ios")'.dependencies]
# ponytail: upstream src/ios/platform_view.rs uses packages::{video_player, camera}
# without cfg gates; drop this once gpui-mobile fixes it.
gpui-mobile = { package = "gpui-pre-mobile", git = "https://github.com/longbridge/gpui-mobile", rev = "c24a1308e1dcb47ce94d9ef8d8d05ca4d77d2aa7", default-features = false, features = ["video_player", "camera"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
android-activity = { version = "0.6", features = ["native-activity"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
# Full debuginfo makes liblt.so ~600 MB per ABI
debug = "line-tables-only"
