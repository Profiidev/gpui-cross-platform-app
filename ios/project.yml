name: {{app_name}}
options:
  bundleIdPrefix: dev.gpui
  deploymentTarget:
    iOS: '16.0'
  xcodeVersion: '16.0'
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: '' # set your team for device builds

targets:
  {{app_name}}:
    type: application
    platform: iOS
    sources:
      - path: App.swift
        type: file
        buildPhase: sources
      - path: LaunchScreen.storyboard
        type: file
        buildPhase: resources
      - path: Assets.xcassets
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: {{app_id}}
        PRODUCT_NAME: {{app_name}}
        # Bumped together with Cargo.toml by .github/workflows/release-trigger.yml
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1,2'
        IPHONEOS_DEPLOYMENT_TARGET: '16.0'
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: '' # set your team for device builds
        SWIFT_VERSION: '5.0'
        SWIFT_OBJC_BRIDGING_HEADER: 'Embedding.h'
        CLANG_ENABLE_MODULES: YES
        CLANG_ENABLE_OBJC_ARC: YES
        ENABLE_BITCODE: NO
        # Disable Xcode 16 debug dylib executor — we statically link
        # the Rust library, so the dynamic loader approach fails on device.
        ENABLE_DEBUG_DYLIB: NO
        OTHER_LINK_BINARY_WITH_LIBRARIES_SECTION_TYPE: static
        DEAD_CODE_STRIPPING: NO
        # Link the Rust static library — use explicit path to .a to avoid
        # the linker picking up the .dylib that sits in the same directory.
        OTHER_LDFLAGS:
          - '-force_load'
          - '$(RUST_STATIC_LIB)'
          - '-lc++'
          - '-framework UIKit'
          - '-framework Metal'
          - '-framework MetalKit'
          - '-framework QuartzCore'
          - '-framework CoreGraphics'
          - '-framework CoreText'
          - '-framework CoreFoundation'
          - '-framework Foundation'
          - '-framework Security'
          - '-framework SystemConfiguration'
          - '-framework AudioToolbox'
          - '-framework WebKit'
          - '-framework CoreMedia'
          - '-framework AVFoundation'
          - '-framework LocalAuthentication'
          - '-framework Contacts'
          - '-framework EventKit'
          - '-framework StoreKit'
          - '-framework CoreMotion'
          - '-ObjC'
        # Preprocessor macros — enable Rust GPUI integration
        GCC_PREPROCESSOR_DEFINITIONS:
          - 'USE_GPUI_RUST=1'
          - '$(inherited)'
        # Header search paths so #import "gpui_ios.h" resolves
        HEADER_SEARCH_PATHS:
          - '$(PROJECT_DIR)'
        # arm64 everywhere, plus x86_64 for the simulator on Intel Macs / VMs
        ARCHS: '$(ARCHS_STANDARD)'
        ONLY_ACTIVE_ARCH: YES
        RUST_PROFILE: debug
        'RUST_TRIPLE[sdk=iphoneos*]': aarch64-apple-ios
        'RUST_TRIPLE[sdk=iphonesimulator*][arch=arm64]': aarch64-apple-ios-sim
        'RUST_TRIPLE[sdk=iphonesimulator*][arch=x86_64]': x86_64-apple-ios
        RUST_STATIC_LIB: '$(PROJECT_DIR)/../target/$(RUST_TRIPLE)/$(RUST_PROFILE)/lib{{crate_name}}.a'
      configs:
        Debug:
          GCC_OPTIMIZATION_LEVEL: '0'
          DEBUG_INFORMATION_FORMAT: 'dwarf-with-dsym'
          SWIFT_OPTIMIZATION_LEVEL: '-Onone'
        Release:
          RUST_PROFILE: release
          GCC_OPTIMIZATION_LEVEL: 's'
          DEBUG_INFORMATION_FORMAT: 'dwarf-with-dsym'
          SWIFT_OPTIMIZATION_LEVEL: '-O'
    preBuildScripts:
      - name: 'Build Rust Static Library'
        script: |
          set -euo pipefail
          # Xcode scripts don't inherit the login shell PATH
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          cd "${PROJECT_DIR}/.."

          [ "${CONFIGURATION}" = "Release" ] && CARGO_FLAGS="--release" || CARGO_FLAGS=""

          # Must match RUST_TRIPLE in the build settings
          for arch in ${ARCHS}; do
            case "${PLATFORM_NAME}/${arch}" in
              iphoneos/*) triple=aarch64-apple-ios ;;
              iphonesimulator/arm64) triple=aarch64-apple-ios-sim ;;
              iphonesimulator/x86_64) triple=x86_64-apple-ios ;;
              *) echo "unsupported ${PLATFORM_NAME}/${arch}"; exit 1 ;;
            esac
            cargo build --lib --target "${triple}" ${CARGO_FLAGS}
          done
        shell: /bin/bash
        basedOnDependencyAnalysis: false
