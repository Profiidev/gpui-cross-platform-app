name: 'App Build and Release'

on:
  pull_request:
  release:
    types:
      - published

jobs:
  release-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            formats: 'deb,appimage'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            formats: 'nsis'
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            target: 'aarch64-apple-darwin'
            formats: 'app,dmg'
          - platform: 'macos-latest' # for Intel based macs.
            target: 'x86_64-apple-darwin'
            formats: 'app,dmg'

    runs-on: ${{ matrix.platform }}
    env:
      # the `cargo build` in the packager hook builds for this target too
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      OUT_DIR: target/${{ matrix.target }}/release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - name: refresh apt index (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # latest
        with:
          # gpui build deps + libfuse2 for linuxdeploy (AppImage)
          packages: pkg-config libfontconfig1-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libwayland-dev libfuse2
          version: 1.3

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8

      - name: Cache cargo and rust files
        id: rust_cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          shared-key: 'app_release_cache-${{ matrix.target }}'

      - name: Build app
        shell: bash
        run: cargo packager --release --target ${{ matrix.target }} -f ${{ matrix.formats }}

      - name: Upload to the release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          cd "$OUT_DIR"
          # both macOS jobs produce Template.app, name the tarball per arch
          if [ -d Template.app ]; then
            tar -czf "Template_${{ matrix.target }}.app.tar.gz" Template.app
          fi
          files=$(ls *.deb *.AppImage *-setup.exe *.dmg *.app.tar.gz 2>/dev/null || true)
          gh release upload "$TAG" $files --clobber

  release-android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk,just

      - name: Cache cargo and rust files
        id: rust_cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          shared-key: 'app_release_android_cache'

      - name: Cache gradle files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: app_release_gradle_cache
          restore-keys: app_release_gradle_cache
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle

      - name: setup Android signing
        if: github.event_name != 'pull_request'
        run: |
          cd android
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > $RUNNER_TEMP/keystore.jks
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

      # the runner image ships an NDK at ANDROID_NDK_LATEST_HOME
      - name: Build app
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: just android-release

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk dist/Template_${{ github.event.release.tag_name || 'pr' }}.apk
          cp android/app/build/outputs/bundle/release/*.aab dist/Template_${{ github.event.release.tag_name || 'pr' }}.aab

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: github.event_name == 'pull_request'
        with:
          name: android
          path: dist/

      - name: Upload to the release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber
