name: 'Desktop Build and Release'

on:
  pull_request:
  release:
    types:
      - published

jobs:
  release-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            formats: 'deb,appimage'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            formats: 'nsis'
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            target: 'aarch64-apple-darwin'
            formats: 'app,dmg'
          - platform: 'macos-latest' # for Intel based macs.
            target: 'x86_64-apple-darwin'
            formats: 'app,dmg'

    runs-on: ${{ matrix.platform }}
    env:
      # the `cargo build` in the packager hook builds for this target too
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      OUT_DIR: target/${{ matrix.target }}/release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - name: refresh apt index (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # latest
        with:
          # gpui build deps + libfuse2 for linuxdeploy (AppImage)
          packages: pkg-config libfontconfig1-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libwayland-dev libfuse2
          version: 1.3

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8

      - name: Cache cargo and rust files
        id: rust_cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          shared-key: 'app_release_cache-${{ matrix.target }}'

      - name: Build app
        shell: bash
        run: cargo packager --release --target ${{ matrix.target }} -f ${{ matrix.formats }}

      - name: Upload to the release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          cd "$OUT_DIR"
          # both macOS jobs produce the same <App>.app, name the tarball per arch
          for app in *.app; do
            [ -d "$app" ] && tar -czf "${app%.app}_${{ matrix.target }}.app.tar.gz" "$app"
          done
          files=$(ls *.deb *.AppImage *-setup.exe *.dmg *.app.tar.gz 2>/dev/null || true)
          gh release upload "$TAG" $files --clobber
